workflow:
  rules:
    # Run for merge requests
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Don't run on branches if there's an open merge request
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    # Run on branches and tags
    - if: $CI_COMMIT_BRANCH || $CI_COMMIT_TAG

include:
  # -- Python -------------------------

  # https://computing.docs.ligo.org/guide/gitlab/components/python/all/
  - component: $CI_SERVER_FQDN/computing/gitlab/components/python/all@4
    inputs:
      code_quality_analyzer: ruff
      merge_request_pipelines: true
      pip_install_options: "--group tests"
      python_versions:
        - "3.11"
        - "3.12"
        - "3.13"
        - "3.14"
      uv: true

  # -- Debian packaging ---------------

  # https://computing.docs.ligo.org/guide/gitlab/components/debian/all/
  - component: $CI_SERVER_FQDN/computing/gitlab/components/debian/all@2
    inputs:
      merge_request_pipelines: true
      needs: [sdist]
      debian_versions:
        - bookworm
      test_install: &system_test_install >-
        python3-coverage
        python3-pytest
        python3-pytest-cov
        python3-requests-ecp
        python3-requests-mock
      test_script: &system_test_script
        # Run pytest with coverage
        - python3 -m pytest
            -ra
            --cov requests_ecp
            --durations 0
            --junit-xml junit.xml
            --pyargs requests_ecp.tests
            --verbose
        # Report coverage
        - python3 -m coverage xml

  # -- Red Hat packaging --------------

  # https://computing.docs.ligo.org/guide/gitlab/components/redhat/all/
  - component: $CI_SERVER_FQDN/computing/gitlab/components/redhat/all@2
    inputs:
      merge_request_pipelines: true
      needs: [sdist]
      redhat_versions:
        - 9
      test_install: *system_test_install
      test_script: *system_test_script

  # -- Documentation ------------------

  # https://computing.docs.ligo.org/guide/gitlab/components/sphinx/build/
  - component: $CI_SERVER_FQDN/computing/gitlab/components/sphinx/build@1
    inputs:
      requirements: ". --group dev"
