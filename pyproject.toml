[build-system]
requires = [
  "setuptools >=30.3.0",
  "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "requests-ecp"
description = "SAML/ECP authentication handler for python-requests"
readme = "README.md"
authors = [
  { name = "Duncan Macleod", email = "duncan.macleod@ligo.org" },
]
license = { text = "GPL-3.0-or-later" }
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.6",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
requires-python = ">=3.11"
dependencies = [
  "lxml",
  "requests",
]

dynamic = [
  "version",
]

[project.optional-dependencies]
kerberos = [
  "requests-gssapi >= 1.2.2",
]

[project.urls]
"Bug Tracker" = "https://git.ligo.org/computing/software/requests-ecp/-/issues"
"Documentation" = "https://requests-ecp.readthedocs.io/"
"Source Code" = "https://git.ligo.org/computing/software/requests-ecp/"

[dependency-groups]
dev = [
  { "include-group" = "docs" },
  { "include-group" = "qa" },
  { "include-group" = "tests" },
]

docs = [
  "furo",
  "sphinx",
  "sphinx-argparse",
  "sphinx-design",
  "sphinx_automodapi",
]
qa = [
  "ruff",
  "ty",
]
tests = [
  "pytest >= 2.9.2",
  "pytest-cov",
  "requests-mock >= 1.5.0",
]

# -- tools

[tool.coverage.paths]
# map standard install paths back to the source to
# enable merging coverage of installed module from
# multiple platforms
source = [
  "requests_ecp/",  # <-- source path, must come first
  "*/requests_ecp/",  # <-- any installed path
]

[tool.coverage.report]
precision = 1

[tool.coverage.run]
source = [
  "ciecplib"
]

[tool.pytest.ini_options]
addopts = "-r a -v"
filterwarnings = [
  # error on any and all unhandled warnings
  "error",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN",  # type annotations for **kwargs
  "D203",  # blank line before class docstring
  "D213",  # docstring summary on second line
  "D413",  # blank line after last section
  "PLR0913",  # too many arguments
  "SIM108",  # if-else instead of ternary if
]
# allow 'mock_...' variables to go unused in tests
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?)|mock_.*)$"

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
  "F401",  # unused-import
  "F403",  # undefined-local-with-import-star
]
"*/tests/*" = [
  "ANN",  # type annotations
  "B904",  # raise from
  "EM101",  # string literal in exception
  "PLR2004",  # magic value used in comparison
  "S101",  # assert
]
"docs/*" = [
  "A",  # builtins
  "ANN",  # type annotations
  "D",  # docstrings
  "INP001",  # implicit namespace package
]

[tool.setuptools]
license-files = [ "LICENSE" ]

[tool.setuptools.dynamic]
version = { attr = "requests_ecp.__version__" }

[tool.setuptools.packages.find]
include = [
  "requests_ecp*",
]
